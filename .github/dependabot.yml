# Dependabot proposes updates to pinned versions as pull requests, which CI
# checks like any other. Each release must be at least a week old first:
# compromised releases are usually found and withdrawn within days.
version: 2
updates:
  # The actions in .github/workflows, pinned to full commits.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # The development tools in pyproject.toml and uv.lock.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      dev-tools:
        patterns: ["*"]
