[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "disc-badger"
version = "0.0.0"
description = "Rips scratched DVDs, Blu-rays, and 4K UHDs."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 1 - Planning",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video :: Conversion",
]
authors = [{ name = "Dryw Wade Clere" }]

[project.urls]
Repository = "https://github.com/clearly-dryw/disc-badger"

[tool.hatch.build.targets.wheel]
packages = ["src/disc_badger"]

[tool.hatch.build.targets.sdist]
include = ["src/disc_badger", "README.md", "LICENSE", "pyproject.toml"]

[dependency-groups]
dev = [
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 80
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
