[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "disc-badger"
version = "0.0.0"
description = "Rips scratched DVDs, Blu-rays, and 4K UHDs."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 1 - Planning",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video :: Conversion",
]
authors = [{ name = "Dryw Wade Clere" }]

[project.urls]
Repository = "https://github.com/clearly-dryw/disc-badger"

[tool.hatch.build.targets.wheel]
packages = ["src/disc_badger"]

[tool.hatch.build.targets.sdist]
include = ["src/disc_badger", "README.md", "LICENSE", "pyproject.toml"]

[dependency-groups]
# Exact versions, so a new release can't change what runs. Everything they
# depend on is locked, with hashes, in uv.lock; upgrades are deliberate, in
# their own commit. hatchling and editables are here so the development install
# builds Disc Badger with locked versions too.
dev = [
    "editables==0.6",
    "hatchling==1.33.0",
    "pyright[nodejs]==1.1.414",
    "pytest==9.2.0",
    "ruff==0.17.6",
]

[tool.uv]
# The oldest uv that reads and writes uv.lock as it is. CI uses this version.
required-version = ">=0.13.9"
# Lock only files at least a week old, so a broken or malicious release has time
# to be noticed and withdrawn first.
exclude-newer = "1 week"
# Build Disc Badger with the locked hatchling and editables, installed first,
# rather than with the newest ones in a separate build environment.
no-build-isolation-package = ["disc-badger"]

[tool.ruff]
line-length = 80
target-version = "py312"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
# Every rule, minus the ones below. Each ignore says why.
select = ["ALL"]
ignore = [
    "COM812",  # trailing commas: ruff format decides; the two would conflict
    "D203",  # no blank line before a class docstring (D211 is used instead)
    "D213",  # docstring summaries start on the first line (D212)
    "EM101",  # exception messages are written inline, where they're read
    "EM102",  # (same, for f-strings)
    "TC003",  # without lazy annotations, type-only imports are still needed
    "TRY003",  # (same as EM101: messages belong in the raise)
]

[tool.ruff.lint.per-file-ignores]
"src/disc_badger/cli/**" = [
    "T201",  # the command line prints to the user on purpose
]
"tools/**" = [
    # Developer tools run git, Python and uv by full path, with only the
    # repository's own file names and settings as arguments.
    "S603",
    "T201",  # developer tools print their findings on purpose
]
"tests/**" = [
    "D1",  # tests are named for what they check; no docstrings required
    "S101",  # pytest checks with assert
    "S603",  # a test may run git on a repository it makes for itself
]

[tool.ruff.lint.flake8-copyright]
# Every file starts with the license line instead of a copyright notice.
notice-rgx = "SPDX-License-Identifier: GPL-3.0-or-later"

[tool.pyright]
# tools/check_all.py gives pyright every Python file git tracks, so no folders
# are listed here.
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
# Where imports are found: Disc Badger's source, which pyright adds by itself
# only when nothing is listed here, and the tools, which the tests import by
# name, as pytest's settings below allow.
extraPaths = ["src", "tools"]
# Ignoring a result must be explicit: `_ = call()`, with a comment saying why.
reportUnusedCallResult = "error"

# The text check, tools/check_text.py, reads every file git tracks but these.
[tool.check-text]
exclude = [
    "uv.lock",  # written by uv; its long lines can't wrap
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The tools run as scripts and import each other's modules by name, such as
# `exit_code`; the tests need their folder on the path to do the same.
pythonpath = ["tools"]
addopts = ["--strict-markers", "--strict-config"]
